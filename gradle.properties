# Project-wide Gradle settings.
#
# Tuned for a reliable first import in Android Studio: correctness and
# predictability are prioritised over maximum build speed. Once you have a
# green build you can re-enable the commented-out options below.

# JVM for the Gradle daemon. 4 GB comfortably covers Kotlin + R8 on this
# codebase; MaxMetaspace is raised because Compose compilation is metaspace
# hungry and the default can produce OutOfMemoryError: Metaspace.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Build the modules that are needed, in parallel where safe.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is intentionally DISABLED.
#
# It is strict about configuration-time file reads and environment access, both
# of which this build performs (loading .env, probing for a keystore and for
# google-services.json). Leaving it on is a common cause of a confusing failure
# on first sync. Enable it later if you want the extra speed.
org.gradle.configuration-cache=false

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Suppresses the warning about the Kotlin/AGP combination when Studio ships a
# newer bundled Kotlin than the project pins.
kotlin.stdlib.default.dependency=true

# Keep the number of workers modest so the build behaves on laptops as well as
# CI runners.
org.gradle.workers.max=4
